services:
  postgres-warehouse:
    image: postgres:16-alpine
    container_name: retailflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retailflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailflow_pass}
      POSTGRES_DB: ${POSTGRES_DB:-retailflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - retailflow_pgdata:/var/lib/postgresql/data
      - ./sql/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailflow_user} -d ${POSTGRES_DB:-retailflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-scheduler-webserver:
    image: apache/airflow:2.9.3-python3.11
    container_name: retailflow-airflow
    depends_on:
      postgres-warehouse:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-retailflow_user}:${POSTGRES_PASSWORD:-retailflow_pass}@postgres-warehouse:5432/${POSTGRES_DB:-retailflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      RETAILFLOW_ENV: docker
      RETAILFLOW_DB_URL: postgresql+psycopg2://${POSTGRES_USER:-retailflow_user}:${POSTGRES_PASSWORD:-retailflow_pass}@postgres-warehouse:5432/${POSTGRES_DB:-retailflow}
      PYTHONPATH: /opt/airflow/src
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"
    command: standalone

  streamlit-workbench:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailflow-workbench
    depends_on:
      postgres-warehouse:
        condition: service_healthy
    environment:
      RETAILFLOW_ENV: docker
      RETAILFLOW_DB_URL: postgresql+psycopg2://${POSTGRES_USER:-retailflow_user}:${POSTGRES_PASSWORD:-retailflow_pass}@postgres-warehouse:5432/${POSTGRES_DB:-retailflow}
      PYTHONPATH: /app/src
    volumes:
      - ./data:/app/data
      - ./sql:/app/sql
    ports:
      - "${STREAMLIT_SERVER_PORT:-8501}:8501"
    command: >
      sh -c "python -m retailflow.cli seed-demo --include-failed-run-demo &&
             streamlit run app/dashboard.py --server.port=8501 --server.address=0.0.0.0"

volumes:
  retailflow_pgdata:
